{% extends "base.html" %}
{% block body %}
<h1>Settings</h1>
{% if saved %}<p class="ok">Saved. New calls use these settings.</p>{% endif %}
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" action="/settings" class="card">
  <p><label>Staff transfer number<br><input name="staff_phone" value="{{ biz.staff_phone or '' }}" placeholder="+92300..."></label></p>
  <p><label>Owner WhatsApp (messages + daily summary)<br><input name="owner_whatsapp" value="{{ biz.owner_whatsapp or '' }}"></label></p>
  <p><label>Delete recordings after (days)<br><input type="number" min="1" max="90" name="recording_retention_days" value="{{ biz.recording_retention_days }}"></label></p>
  <p><label>Timings <span class="muted">— {"slot_minutes": 30, "days": {"mon": [["09:00","13:00"],["16:00","20:00"]], ...}}</span><br>
  <textarea name="timings" rows="10">{{ timings }}</textarea></label></p>
  <p><label>FAQ / business info the AI may quote <span class="muted">— fees, address, parking, doctors…</span><br>
  <textarea name="faq" rows="12">{{ faq }}</textarea></label></p>
  <p><label>Voice overrides <span class="muted">— leave {} for defaults</span><br>
  <textarea name="voice" rows="4">{{ voice }}</textarea></label></p>
  <p><button class="primary">Save</button></p>
</form>
<p class="muted">AI number: {{ biz.ai_phone or "not set" }}. Forward missed / after-hours calls from your clinic number to it.</p>
{% endblock %}
