<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Awaaz Desk{% endblock %}</title>
<style>
:root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#667085; --line:#e4e7ec; --accent:#0f766e; --warn:#b42318; }
* { box-sizing:border-box; }
body { margin:0; font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
header { background:var(--card); border-bottom:1px solid var(--line); padding:12px 16px; display:flex; flex-wrap:wrap; gap:8px 20px; align-items:center; }
header strong { font-size:16px; margin-right:auto; }
nav a { color:var(--muted); text-decoration:none; margin-right:14px; }
nav a.on { color:var(--accent); font-weight:600; }
main { max-width:980px; margin:0 auto; padding:20px 16px 60px; }
h1 { font-size:20px; margin:0 0 16px; }
h2 { font-size:16px; margin:24px 0 8px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
.tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:12px; }
.tile { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
.tile b { display:block; font-size:28px; font-variant-numeric:tabular-nums; }
.tile span { color:var(--muted); font-size:13px; }
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
th { color:var(--muted); font-weight:500; font-size:13px; }
.muted { color:var(--muted); }
.pill { display:inline-block; padding:1px 8px; border-radius:99px; background:#eef4f3; color:var(--accent); font-size:12px; }
.pill.off { background:#f2f4f7; color:var(--muted); }
button, .btn { font:inherit; border:1px solid var(--line); background:var(--card); border-radius:6px; padding:4px 10px; cursor:pointer; color:var(--ink); }
button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
input, textarea, select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; max-width:100%; }
textarea { width:100%; font-family:ui-monospace, monospace; font-size:13px; }
form.inline { display:inline; }
.err { color:var(--warn); }
.ok { color:var(--accent); }
.scroll { overflow-x:auto; }
pre { white-space:pre-wrap; font:13px/1.5 ui-monospace, monospace; }
</style>
</head>
<body>
{% if biz %}
<header>
  <strong>{{ biz.name }}</strong>
  <nav>
    {% for key, label in [("today","Today"),("calendar","Calendar"),("calls","Calls"),("messages","Messages"),("settings","Settings"),("billing","Billing")] %}
    <a href="/{{ '' if key == 'today' else key }}" class="{{ 'on' if page == key or (page == 'call' and key == 'calls') }}">{{ label }}</a>
    {% endfor %}
  </nav>
  <form class="inline" method="post" action="/logout"><button>Log out</button></form>
</header>
{% endif %}
<main>{% block body %}{% endblock %}</main>
</body>
</html>
