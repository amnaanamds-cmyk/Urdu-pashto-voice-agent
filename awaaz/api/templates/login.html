{% extends "base.html" %}
{% block body %}
<div class="card" style="max-width:420px;margin:60px auto">
  <h1>Awaaz Desk</h1>
  <p class="muted">Enter the owner token you received at sign-up.</p>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input name="token" type="password" autocomplete="current-password" style="width:100%" required>
    <p><button class="primary">Log in</button></p>
  </form>
</div>
{% endblock %}
